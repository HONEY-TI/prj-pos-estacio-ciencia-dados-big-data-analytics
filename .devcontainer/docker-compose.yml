services:
  rstudio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rstudio-dev-base # docker exec -it rstudio-dev-base bash
    environment:
      PASSWORD: "toor"
      # Spark
      SPARK_MASTER: spark://spark-master:7077
      SPARK_HOME: /opt/spark
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    ports:
      - "8787:8787" # http://localhost:8787/ user: rstudio password: toor
      - "8888:8888" # http://localhost:8888/
    volumes:
      - ../workspaces:/home/rstudio/workspaces:cached
      - ../workspaces:/workspaces:cached
      - ../sem2-ciclo-de-vida-e-linguagem-r:/workspaces/sem2-ciclo-de-vida-e-linguagem-r:cached
      - ../sem2-tecnologias-avancadas:/workspaces/sem2-tecnologias-avancadas:cached
      - ../sem2-teorias-analiticas-avancadas:/workspaces/sem2-teorias-analiticas-avancadas:cached
      - ../sem2-fundamentos-e-projeto-de-big-data:/workspaces/sem2-fundamentos-e-projeto-de-big-data:cached      
      - vscode-extensions:/.vscode/extensions:/rstudio/.vscode-server/extensions
    restart: unless-stopped
    command: ["/usr/local/bin/docker-entrypoint.sh"]    
    networks:
      - app-network    
    depends_on:
      spark-master:
        condition: service_started #ping -c 4 spark-master
      spark-worker:
        condition: service_started
      postgres-db:
        condition: service_started        
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"

  spark-master:
    container_name: spark-master
    image: apache/spark:3.5.1    
    environment:
      SPARK_NO_DAEMONIZE: "true"    
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_LOCAL_HOSTNAME: spark-master      
    hostname: spark-master
    ports:
      - "7077:7077"
      - "8080:8080"
    command: >
        /opt/spark/bin/spark-class
        org.apache.spark.deploy.master.Master
    mem_limit: 2g
    cpus: 2
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "1"

  spark-worker:
    container_name: spark-worker
    image: apache/spark:3.5.1
    environment:
      SPARK_MODE: worker
      SPARK_LOCAL_HOSTNAME: spark-worker
      SPARK_MASTER_URL: spark://spark-master:7077 #spark://localhost:7077      
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
      PYSPARK_PYTHON: /opt/venv/bin/python
      PYSPARK_DRIVER_PYTHON: /opt/venv/bin/python
    hostname: spark-worker
    ports:
      - "8081:8081"
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    networks:
      - app-network      
    depends_on:
      spark-master:
        condition: service_started #ping -c 4 spark-master
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "1"

  hadoop-namenode:
    image: apache/hadoop:3
    container_name: hadoop-namenode
    hostname: namenode
    command: sleep infinity
    environment:
      HDFS_NAMENODE_USER: rstudio
      HDFS_DATANODE_USER: rstudio
    ports:
      - "9870:9870" # localhost:50070
      - "9000:9000"
    networks:
      - app-network
    volumes:
      - hadoop-namenode-data:/data
      - ./hadoop-config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop-config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro

  hadoop-datanode:
    image: apache/hadoop:3
    container_name: hadoop-datanode
    hostname: hadoop-datanode
    command: sleep infinity
    depends_on:
      - hadoop-namenode
    environment:
      HDFS_NAMENODE_USER: rstudio
      HDFS_DATANODE_USER: rstudio
    ports:
      - "9864:9864"
    networks:
      - app-network
    volumes:
      - hadoop-datanode-data:/data
      - ./hadoop-config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop-config/hdfs-site.xml:/opt/hadooclsp/etc/hadoop/hdfs-site.xml:ro

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - app-network
      
  kafka-broker:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-broker
    hostname: kafka-broker
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT:
        zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS:
        PLAINTEXT://kafka-broker:9092
      KAFKA_LISTENERS:
        PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - app-network

  postgres-db:
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  vscode-extensions:
  hadoop-namenode-data:
  hadoop-datanode-data:
  kafka-data:
  postgres-data:

networks:
  app-network:
    driver: bridge  